<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <!-- บรรทัดนี้ทำให้แสดงผลบนมือถือถูกต้อง (mobile-first) -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Find Fish{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <!-- บรรทัดนี้ใส่ลิงก์ Google Fonts ตรงนี้ -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <a href="{{ url_for('index') }}" class="logo" aria-label="Find Fish — หน้าแรก">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Find Fish">
    </a>
    <a href="{{ url_for('filterpage') }}" class="filter-link">กรอง</a>
    <a href="{{ url_for('disease_list') }}" class="filter-link">โรคปลา</a>
    <a href="{{ url_for('compare') }}" class="filter-link">เปรียบเทียบปลา</a>
    <span class="tagline">ข้อมูลปลาเศรษฐกิจ ครบในที่เดียว</span>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    โครงงาน Find Fish โดยกลุ่ม CODEBLUE · ข้อมูลเพื่อการศึกษา อ้างอิงเอกสารกรมประมงเป็นหลัก
  </footer>
</body>
</html>
